name: Simple Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create tarball of repo
        run: |
          tar --exclude='.git' -czf repo.tar .

      - name: Copy tarball to server
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: 22
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "repo.tar"
          target: "${{ secrets.DEPLOY_DIR }}/repo.tar"

      - name: SSH to server: run deploy script
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: 22
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_DIR }}"
            # unpack repo.tar if present
            if [ -f repo.tar ]; then
              tar -xzf repo.tar -C "${{ secrets.DEPLOY_DIR }}"
              rm -f repo.tar
            fi
            # run deploy script (make sure deploy.sh is executable)
            if [ -x ./deploy.sh ]; then
              ./deploy.sh
            else
              docker compose pull || true
              docker compose up -d --build --remove-orphans
            fi
